name: CI

# Filet anti-régression du chemin critique d'exécution.
# N'exécute QUE les tests hermétiques (COINBASE_MODE=paper forcé par run_tests.py) :
# aucun secret, aucun accès au compte réel. test_live.py est exclu par le runner.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Un seul run par branche : annule les runs obsolètes quand on repush.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests hermétiques
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (paper, hermétique)
        env:
          COINBASE_MODE: paper
        run: python run_tests.py
